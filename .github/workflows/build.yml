name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Zip'i ac ve APK'yi derle
        run: |
          ZIP="$(ls *.zip | head -1)"
          echo "Kullanilan zip: $ZIP"
          unzip -o -q "$ZIP" -d kaynak
          PROJE="$(dirname "$(find kaynak -name gradlew | head -1)")"
          cd "$PROJE"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Asistan.apk"

      - name: APK'yi indirme sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Asistan.apk --title "Asistan APK" --notes "Telefona kurmak icin Asistan.apk dosyasina dokun."
