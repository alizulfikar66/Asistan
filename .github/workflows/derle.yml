name: APK derle

on:
  push:
    paths:
      - "Asistan.zip"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asistan.zip dosyasını aç
        run: |
          unzip -q -o Asistan.zip -d kaynak
          chmod +x kaynak/Asistan/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK'yı derle
        working-directory: kaynak/Asistan
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp kaynak/Asistan/app/build/outputs/apk/debug/*.apk Asistan.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Asistan.apk --title "Asistan APK" --notes "Otomatik derlendi" --latest
